# https://render.com/docs/static-sites
# Vite publishes to dist (not the Svelte template's public/).
services:
  - type: web
    runtime: static
    name: abyssus-save-explorer
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
